name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # No secrets are passed or inherited by the workflow executing PR code.
    uses: ./.github/workflows/ci-verify.yml
    permissions:
      contents: read

  windows:
    name: Windows consent host
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Qualify window-only capture behind an independent overlay
        run: bun run test:computer:windows-capture
      - name: Compile native consent host and qualify protocol and readiness rules
        run: bun run test:computer:windows
      - name: Qualify desktop connection manager
        run: bun run test:computer:windows-desktop
      - name: Qualify packaged worker and native process-tree ownership
        run: bun run test:computer:windows-worker "${{ runner.temp }}/computer-release"
      - name: Set up the pinned portable installer compiler
        run: ./scripts/setupInno.ps1 -Destination "${{ runner.temp }}/mira-inno"
      - name: Qualify per-user Windows installation and upgrades
        run: bun --no-env-file scripts/testWindowsInstaller.ts "${{ runner.temp }}/computer-release" "${{ runner.temp }}/mira-inno/portable/ISCC.exe"
      - name: Transfer only the qualified Windows release assets
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-windows-computer
          path: ${{ runner.temp }}/computer-release/*
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - name: Verify private consent process lifecycle on Windows
        run: bun test apps/mira/src/server/computer/native.test.ts scripts/computerRelease.test.ts apps/mira/src/server/computer/companion.test.ts apps/mira/src/server/computer/updateDownload.test.ts apps/mira/src/server/computer/updatePipe.test.ts apps/mira/src/server/computer/companionParent.test.ts apps/mira/src/server/computer/installationLease.test.ts apps/mira/src/server/computer/consentProcess.test.ts apps/mira/src/server/computer/localConsentHost.test.ts apps/mira/src/server/computer/companionConsent.test.ts apps/mira/src/server/computer/companionLifecycle.test.ts apps/mira/src/server/computer/companionCommands.test.ts apps/mira/src/server/computer/companionWork.test.ts apps/mira/src/server/runtime/rpcCleanup.test.ts

  verify:
    # Preserve the required check name and fail closed on skipped/failed/cancelled tests.
    needs: [checks, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful source verification
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: test "$CHECK_RESULT" = success && test "$WINDOWS_RESULT" = success

  coverage:
    needs: verify
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Only the protected base supplies Git metadata/config; never execute PR source here.
      - name: Check out trusted coverage context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Download the report outside the trusted checkout
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-input
      - name: Validate and copy one passive coverage report
        env:
          COVERAGE_INPUT: ${{ runner.temp }}/coverage-input
          COVERAGE_OUTPUT: ${{ runner.temp }}/coverage-validated
        run: |
          python3 -I - <<'PY'
          import os
          import pathlib
          import stat

          source = pathlib.Path(os.environ["COVERAGE_INPUT"])
          target = pathlib.Path(os.environ["COVERAGE_OUTPUT"])
          if source.is_symlink() or sorted(p.name for p in source.iterdir()) != ["lcov.info"]:
              raise SystemExit("Expected exactly one passive coverage report")
          descriptor = os.open(source / "lcov.info", os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
          with os.fdopen(descriptor, "rb") as report:
              metadata = os.fstat(report.fileno())
              if not stat.S_ISREG(metadata.st_mode) or not 0 < metadata.st_size <= 32 * 1024 * 1024:
                  raise SystemExit("Invalid coverage report type or size")
              content = report.read(32 * 1024 * 1024 + 1)
          if len(content) != metadata.st_size:
              raise SystemExit("Coverage report changed while reading")
          content.decode("utf-8", errors="strict")
          target.mkdir(mode=0o700)
          with (target / "lcov.info").open("xb") as validated:
              validated.write(content)
          PY
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ${{ runner.temp }}/coverage-validated/lcov.info
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_pr: ${{ github.event.pull_request.number }}
          flags: unit-component-integration
          disable_search: true
          disable_file_fixes: true
          plugins: noop
          fail_ci_if_error: true
