name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: homelab_test
          POSTGRES_PASSWORD: isolated-test-only-password
          POSTGRES_DB: homelab_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homelab_test -d homelab_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HOMELAB_TEST_DATABASE_URL: postgres://homelab_test:isolated-test-only-password@127.0.0.1:5432/homelab_auth_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting, lint and types
        run: bun run check
      - name: Check auth migration metadata without a database
        run: bun run db:check:auth
      - name: Check dashboard migration metadata without a database
        run: bun run db:check:dashboard
      - name: Run unit and component tests with coverage
        run: bun run test:coverage
      - name: Run HTTP and database integration tests with coverage
        run: bun run test:integration:coverage
      - name: Test native resource collection with synthetic cgroups
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/monitoring -p 'test_*.py'
      - name: Build both applications
        run: bun run build
      - name: Verify built runtime and browser assets
        run: bun run test:smoke
      - name: Check complete coverage inventory
        run: bun run test:coverage:check
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage/lcov.info
          flags: unit-component-integration
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
