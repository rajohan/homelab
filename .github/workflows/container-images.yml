name: Container images

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    if: "!github.event.release.prerelease"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Read release identity
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          [[ "$RELEASE_TAG" == "v$version" ]]
          git merge-base --is-ancestor HEAD origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dashboard_schema=$(bun scripts/releaseSchema.ts)" >> "$GITHUB_OUTPUT"
          echo "auth_schema=$(bun scripts/releaseSchema.ts auth)" >> "$GITHUB_OUTPUT"
          # Refresh distribution packages at least weekly when a release is built.
          echo "packages_week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Auth
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          build-args: APP=auth
          platforms: linux/amd64
          load: true
          pull: true
          tags: homelab-release/auth:built
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            io.homelab.auth-schema=${{ steps.source.outputs.auth_schema }}
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth
      - name: Build Main with shared browser and code tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            APP=homelab
            PACKAGES_WEEK=${{ steps.source.outputs.packages_week }}
          platforms: linux/amd64
          load: true
          pull: true
          tags: homelab-release/homelab:built
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            io.homelab.dashboard-schema=${{ steps.source.outputs.dashboard_schema }}
          cache-from: type=gha,scope=homelab
          cache-to: type=gha,mode=max,scope=homelab
      - name: Build shared network proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/browser-proxy/Dockerfile
          build-args: PACKAGES_WEEK=${{ steps.source.outputs.packages_week }}
          platforms: linux/amd64
          load: true
          pull: true
          tags: homelab-release/mira-browser-proxy:built
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
          cache-from: type=gha,scope=mira-browser-proxy
          cache-to: type=gha,mode=max,scope=mira-browser-proxy
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable image references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 -I scripts/publishImages.py
      - name: Retain container manifest evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release-manifest-${{ github.run_attempt }}.json
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Retain browser manifest evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: browser-manifest-${{ github.run_attempt }}.json
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Retain code runtime manifest evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: daytona-manifest-${{ github.run_attempt }}.json
          archive: false
          retention-days: 90
          if-no-files-found: error

  computer:
    if: "!github.event.release.prerelease"
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      SOURCE_SHA: ${{ github.sha }}
      COMPUTER_RELEASE_DIRECTORY: ${{ runner.temp }}/computer-release/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          [[ "$RELEASE_TAG" == "v$version" ]]
          git merge-base --is-ancestor HEAD origin/main
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare managed installer compiler
        run: ./scripts/setupInno.ps1 -Destination "${{ runner.temp }}/mira-inno"
      - name: Build Windows package and installer
        run: bun --no-env-file scripts/buildComputerRelease.ts "${{ runner.temp }}/computer-release" "${{ runner.temp }}/mira-inno/portable/ISCC.exe"
      - name: Publish immutable Windows files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python -I scripts/publishComputerRelease.py
      - name: Prepare Windows manifest evidence
        run: Copy-Item "$env:COMPUTER_RELEASE_DIRECTORY/mira-computer-$($env:RELEASE_TAG.Substring(1))-windows-x64.json" "computer-manifest-$env:GITHUB_RUN_ATTEMPT.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: computer-manifest-${{ github.run_attempt }}.json
          archive: false
          retention-days: 90
          if-no-files-found: error
