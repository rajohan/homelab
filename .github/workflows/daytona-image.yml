name: Daytona check image

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: daytona-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-checks:
    if: github.event_name == 'release' && !github.event.release.prerelease
    uses: ./.github/workflows/ci.yml

  build-and-test:
    needs: release-checks
    if: >-
      !cancelled() &&
      (github.event_name != 'release' || needs.release-checks.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Validate source version and release ancestry
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$EVENT_NAME" == release ]]; then
            [[ "$RELEASE_TAG" == "v$version" ]]
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install locked test dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the disposable check image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/daytona/Dockerfile
          platforms: linux/amd64
          load: true
          tags: homelab-daytona/daytona-check:tested
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            org.opencontainers.image.title=Homelab Daytona checks
          cache-from: type=gha,scope=daytona-check
          cache-to: type=gha,mode=max,scope=daytona-check
      - name: Run the full exact-commit checks in the actual image
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: bun run test:daytona "$SOURCE_SHA" homelab-daytona/daytona-check:tested
      - name: Save only the tested check image
        if: github.event_name == 'release'
        run: docker save --output images.tar homelab-daytona/daytona-check:tested
      - name: Transfer tested images to the publisher
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-daytona-image
          path: images.tar
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download the tested images from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-daytona-image
      - name: Authenticate to this repository's container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact tested images and record immutable references
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          repository="${REPOSITORY,,}"
          docker load --input images.tar
          for app in daytona-check; do
            local_image="homelab-daytona/$app:tested"
            image="ghcr.io/$repository/$app:$version"
            [[ "$(docker inspect --format '{{.Config.User}}' "$local_image")" == postgres ]]
            [[ "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$local_image")" == "$SOURCE_SHA" ]]
            [[ "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$local_image")" == "$version" ]]
            # Image IDs differ between classic and containerd stores; hash the saved config.
            config_file="$(tar -xOf images.tar manifest.json | jq -er --arg tag "$local_image" '.[] | select(.RepoTags | index($tag)) | .Config')"
            config_digest="sha256:$(tar -xOf images.tar "$config_file" | sha256sum | cut -d ' ' -f 1)"
            if docker manifest inspect "$image" > existing-manifest.json 2> registry-error.log; then
              # A retry can reuse the exact same image, never replace a published version.
              [[ "$(jq -r '.config.digest' existing-manifest.json)" == "$config_digest" ]]
            else
              grep -Eq 'manifest unknown|no such manifest|NAME_UNKNOWN' registry-error.log || { echo "Cannot verify registry state safely."; exit 1; }
              docker tag "$local_image" "$image"
              docker push "$image"
            fi
            docker manifest inspect "$image" > manifest.json
            [[ "$(jq -r '.config.digest' manifest.json)" == "$config_digest" ]]
            # Pull obtains the registry's digest without rebuilding the tested image.
            docker pull "$image"
            digest="$(docker image inspect "$image" | jq -r --arg prefix "ghcr.io/$repository/$app@sha256:" '.[0].RepoDigests[] | select(startswith($prefix))')"
            [[ "$digest" == "ghcr.io/$repository/$app@sha256:"* ]]
            jq -n --arg app "$app" --arg tag "$image" --arg reference "$image@${digest##*@}" '{app:$app, tag:$tag, reference:$reference}' > "$app-image.json"
          done
          jq -s --arg version "$version" --arg revision "$SOURCE_SHA" '{version:$version, revision:$revision, platform:"linux/amd64", images:.}' daytona-check-image.json > daytona-image.json
          cp daytona-image.json "daytona-manifest-$GITHUB_RUN_ATTEMPT.json"
          {
            echo '## Published Daytona check image'
            echo ''
            jq -r '.images[] | "- \(.app): \(.reference)"' daytona-image.json
            echo ''
            echo 'Publication does not create or qualify a Daytona snapshot, deploy or restart a service.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact manifest evidence for this workflow attempt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: daytona-manifest-${{ github.run_attempt }}.json
          # v7 direct uploads use the filename as the artifact name; `name` is ignored.
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Attach deployment references to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" daytona-image.json --clobber
