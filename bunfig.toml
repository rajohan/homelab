[install]
exact = true
auto = "disable"

[run]
bun = true
shell = "bun"

[serve.static]
plugins = ["./scripts/development/routerHmr.ts", "bun-plugin-tailwind"]
env = "disable"

[test]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
    "**/dist/**",
    "**/node_modules/**",
    "tests/**",
    "**/testing/**",
]
