            "bun:*",
            "node:*",
            "effect",
            "effect/*",
            "@trpc/server",
            "@trpc/server/*",
            "@simplewebauthn/server",
            "@simplewebauthn/server/*",
            "drizzle-orm",
            "drizzle-orm/*",
            "**/features/**",
            "@homelab/ui/identity",
            "@homelab/ui/identity/*",
        ], message = "Generic UI primitives must not depend on identity features, applications or server modules." },
    ] },
]

[[lint.overrides]]
files = ["packages/contracts/src/**/*.{ts,tsx}"]
excludeFiles = ["**/*.test.{ts,tsx}", "tests/**/*.ts"]

