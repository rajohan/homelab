[install]
exact = true
auto = "disable"

[run]
bun = true
shell = "bun"

[serve.static]
plugins = ["./scripts/development/routerHmr.ts", "bun-plugin-tailwind"]
env = "disable"

[test]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
    "**/dist/**",
    "**/node_modules/**",
    "tests/**",
    "apps/**/testing/**",
]

[fmt]
# Keep the existing printing style; sortImports opts into Bun's named-import sorting.
flavor = "oxfmt"
endOfLine = "lf"
ignorePatterns = [
    "CHANGELOG.md",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "bun.lock",
    "**/*.min.css",
    "**/*.min.js",
]
printWidth = 90
semi = true
singleQuote = false
jsxSingleQuote = false
sortImports = true
sortPackageJson = true
tabWidth = 4
trailingComma = "es5"
useTabs = false

[fmt.sortTailwindcss]
functions = ["clsx", "cn", "twMerge"]
stylesheet = "scripts/format.css"
config = "tailwind.config.ts"

[[fmt.overrides]]
files = ["*.yaml", "*.yml"]
options = { tabWidth = 2 }

[[fmt.overrides]]
files = [".bun-test-timings.json", ".bun-browser-test-timings.json"]
options = { tabWidth = 2 }

[lint]
# Bun's compatibility mode keeps the existing rule semantics without an Oxc binary.
flavor = "oxlint"
# Resolve browser, server and test globals from their TypeScript environments.
inferGlobals = true
typeAware = true
typeCheck = true
denyWarnings = true
reportUnusedDisableDirectives = "error"
ignorePatterns = [
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/*.log",
    "**/*.tsbuildinfo",
    ".git/**",
    ".vscode/**",
]
plugins = [
    "eslint",
    "import",
    "jest",
    "jsx-a11y",
    "node",
    "oxc",
    "promise",
    "react",
    "react-perf",
    "typescript",
    "unicorn",
    { name = "documentation", specifier = "./scripts/lint/documentation.ts" },
    { name = "jsdoc-js", specifier = "eslint-plugin-jsdoc" },
    "eslint-plugin-react-you-might-not-need-an-effect",
    "oxlint-tailwindcss",
]

[lint.categories]
correctness = "error"

