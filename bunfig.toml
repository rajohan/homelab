[lint.settings]
react = { version = "19.3.0" }
tailwindcss = { entryPoint = "apps/dashboard/src/styles.css" }

[[lint.overrides]]
files = [
    "apps/auth/src/**/*.{ts,tsx}",
    "apps/dashboard/src/**/*.{ts,tsx}",
    "apps/mira/src/**/*.{ts,tsx}",
    "scripts/**/*.ts",
    "*.config.ts",
    "**/*.test.{ts,tsx}",
    "tests/**/*.ts",
]
globals = { Bun = "readonly" }

[[lint.overrides]]
files = [
    "apps/dashboard/src/browser/main.tsx",
    "apps/dashboard/src/browser/api/client.ts",
    "apps/dashboard/src/browser/**/*.{ts,tsx}",
    "apps/auth/src/browser/**/*.{ts,tsx}",
    "packages/ui/src/**/*.{ts,tsx}",
]
excludeFiles = ["**/*.test.{ts,tsx}", "tests/**/*.ts"]

[lint.overrides.rules]
"react-you-might-not-need-an-effect/no-derived-state" = "error"
"react-you-might-not-need-an-effect/no-chain-state-updates" = "error"
"react-you-might-not-need-an-effect/no-event-handler" = "error"
"react-you-might-not-need-an-effect/no-adjust-state-on-prop-change" = "error"
"react-you-might-not-need-an-effect/no-reset-all-state-on-prop-change" = "error"
"react-you-might-not-need-an-effect/no-pass-live-state-to-parent" = "error"
"react-you-might-not-need-an-effect/no-pass-data-to-parent" = "error"
"react-you-might-not-need-an-effect/no-external-store-subscription" = "error"
"react-you-might-not-need-an-effect/no-initialize-state" = "error"
"tailwindcss/consistent-variant-order" = "error"
"tailwindcss/enforce-canonical" = "error"
"tailwindcss/prefer-scale-token" = ["error", { step = 0.25 }]
"tailwindcss/enforce-consistent-important-position" = "error"
"tailwindcss/enforce-consistent-variable-syntax" = "error"
"tailwindcss/enforce-negative-arbitrary-values" = "error"
"tailwindcss/enforce-shorthand" = "error"
"tailwindcss/no-conflicting-classes" = "error"
"tailwindcss/no-dark-without-light" = "error"
"tailwindcss/no-deprecated-classes" = "error"
"tailwindcss/no-duplicate-classes" = "error"
"tailwindcss/no-unknown-classes" = ["error", { ignorePrefixes = ["language-"] }]
"tailwindcss/no-unnecessary-arbitrary-value" = "error"
"tailwindcss/no-unnecessary-whitespace" = "error"
no-restricted-globals = [
    "error",
    { checkGlobalObject = true, globals = [
        "Bun",
        "Buffer",
        "Deno",
        "process",
    ] },
]
no-restricted-imports = [
    "error",
    { paths = [
        { name = "react", importNames = [
            "memo",
            "useMemo",
            "useCallback",
        ], message = "React Compiler owns memoization; do not add manual memo, useMemo or useCallback." },
    ], patterns = [
        { group = [
            "@homelab/mira",
            "@homelab/mira/*",
            "bun",
            "bun:*",
            "node:*",
            "effect",
            "effect/*",
            "@trpc/server",
            "@trpc/server/*",
            "@simplewebauthn/server",
            "@simplewebauthn/server/*",
            "drizzle-orm",
            "drizzle-orm/*",
            "**/scripts/**",
            "**/server/**",
            "!**/server/api/router",
            "**/http",
            "**/http.ts",
            "**/system",
            "**/system.ts",
        ], message = "Browser code must not import server runtime or repository scripts." },
        { group = [
            "**/api",
            "**/api.ts",
            "**/server/api/router",
        ], allowTypeImports = true, message = "Only erased tRPC router types may cross from server API to browser code." },
    ] },
]

[[lint.overrides]]
files = ["packages/ui/src/**/*.{ts,tsx}"]
excludeFiles = ["**/*.test.{ts,tsx}", "tests/**/*.ts"]

[lint.overrides.rules]
no-restricted-imports = [
    "error",
    { paths = [
        { name = "react", importNames = [
            "memo",
            "useMemo",
            "useCallback",
        ], message = "React Compiler owns memoization; do not add manual memo, useMemo or useCallback." },
    ], patterns = [
        { group = [
            "**/apps/**",
            "@homelab/auth",
            "@homelab/dashboard",
            "@homelab/mira",
            "@homelab/mira/*",
            "bun",
            "bun:*",
            "node:*",
            "effect",
            "effect/*",
            "@trpc/server",
            "@trpc/server/*",
            "@simplewebauthn/server",
            "@simplewebauthn/server/*",
            "drizzle-orm",
            "drizzle-orm/*",
        ], message = "Shared UI must remain browser-safe and independent of applications." },
    ] },
]

[[lint.overrides]]
files = ["packages/ui/src/components/**/*.{ts,tsx}"]
excludeFiles = ["**/*.test.{ts,tsx}", "tests/**/*.ts"]

[lint.overrides.rules]
no-restricted-imports = [
    "error",
    { paths = [
        { name = "react", importNames = [
            "memo",
            "useMemo",
            "useCallback",
