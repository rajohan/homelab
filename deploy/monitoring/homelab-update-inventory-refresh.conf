# Optional per-instance drop-in: refresh package lists, never install packages.
# Keep this separate from apt-daily's boot/provisioning dependencies.
# APT needs its normal root context to drop privileges to _apt. The '+' applies
# only to this fixed preparation command; publisher sandboxing is unchanged.
[Service]
ExecStartPre=+/usr/bin/apt-get -o APT::Update::Error-Mode=any update
