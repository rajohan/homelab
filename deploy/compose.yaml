name: homelab-foundation

services:
  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: dashboard
    image: homelab/dashboard:foundation
    environment:
      HOMELAB_DASHBOARD_HOST: 0.0.0.0
      HOMELAB_DASHBOARD_PORT: "3100"
    ports:
      - "127.0.0.1:3110:3100"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3100/health/ready'); process.exit(r.ok ? 0 : 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: auth
    image: homelab/auth:foundation
    environment:
      HOMELAB_AUTH_HOST: 0.0.0.0
      HOMELAB_AUTH_PORT: "3101"
    ports:
      - "127.0.0.1:3111:3101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3101/health/ready'); process.exit(r.ok ? 0 : 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
