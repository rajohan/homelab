# Dedicated explicit forward proxy. The browser has no direct external route.
http_port 3128
visible_hostname mira-egress
# Resolve in this namespace so destination filtering also covers DNS.
dns_nameservers 1.1.1.1 9.9.9.9
positive_dns_ttl 5 seconds
negative_dns_ttl 1 seconds
pid_filename /tmp/squid.pid
cache_log /dev/stderr
access_log none
cache_store_log none
cache deny all
cache_mem 8 MB
maximum_object_size_in_memory 0 KB
pinger_enable off
icp_port 0
htcp_port 0
netdb_filename none
coredump_dir /tmp
shutdown_lifetime 1 seconds
connect_timeout 10 seconds
request_timeout 30 seconds
read_timeout 60 seconds
client_lifetime 5 minutes
forwarded_for delete
host_verify_strict on

acl web_ports port 80 443
acl tls_port port 443
acl CONNECT method CONNECT
acl web_protocol proto HTTP HTTPS
# Refuse private, loopback, shared, link-local, documentation and other special destinations.
# DNS-based dst ACLs examine all resolved addresses, including mixed public/private answers.
acl restricted dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16
acl restricted dst 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16
acl restricted dst 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl restricted dst ::/128 ::1/128 64:ff9b::/96 64:ff9b:1::/48 100::/64 fc00::/7 fe80::/10 ff00::/8
acl restricted dst 2001::/23 2001:db8::/32 2002::/16 3fff::/20
http_access deny manager
http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access deny !CONNECT !web_protocol
http_access deny restricted
acl resolved_public dst 0.0.0.0/1 128.0.0.0/1
http_access allow resolved_public
http_access deny all
