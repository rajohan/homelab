include /etc/mira-net/common.conf
dns_nameservers 1.1.1.1 9.9.9.9
acl web_ports port 80 443
acl tls_port port 443
acl CONNECT method CONNECT
acl web_protocol proto HTTP HTTPS
# Refuse private, loopback, shared, link-local, documentation and other special destinations.
# DNS-based dst ACLs examine all resolved addresses, including mixed public/private answers.
include /etc/mira-net/restricted.conf
acl private_names dstdomain .localhost .local .internal .lan .home.arpa .home.rajohan.no
http_access deny private_names
http_access deny manager
http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access deny !CONNECT !web_protocol
http_access deny restricted
acl resolved_public dst 0.0.0.0/1 128.0.0.0/1
http_access allow resolved_public
http_access deny all
