pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css,html,md,yml,yaml,toml}"
      # Keep bunfig.toml authoritative instead of inheriting parent formatter configs.
      run: bun fmt --no-config --check {staged_files}
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: bun run lint {staged_files}
